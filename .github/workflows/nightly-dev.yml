name: Nightly Dev Build
run-name: Nightly Dev Build (${{ github.sha }})

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:

jobs:
  dev-build-and-release:
    name: Build Dev APK & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Generate Dev Version Tag
        id: dev_tag
        run: |
          DATE=$(date +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="v0.1.4-dev.${DATE}.${SHORT_SHA}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build Receipts Dev APK
        env:
          GITHUB_REF_NAME: ${{ steps.dev_tag.outputs.tag_name }}
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Collect Dev Artifacts
        run: |
          mkdir -p dev-artifacts
          TAG="${{ steps.dev_tag.outputs.tag_name }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "dev-artifacts/receipts-${TAG}.apk"

      - name: Create Pre-Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.dev_tag.outputs.tag_name }}
          target_commitish: develop
          name: "Development Build ${{ steps.dev_tag.outputs.tag_name }}"
          files: dev-artifacts/*
          draft: false
          prerelease: true
          generate_release_notes: true

      - name: Publish APK to F-Droid Archive
        if: ${{ env.FDROID_REPO_TOKEN != '' }}
        env:
          FDROID_REPO_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${FDROID_REPO_TOKEN}@github.com/Tau2C/fdroid-repo.git" fdroid-repo
          mkdir -p fdroid-repo/archive

          TAG="${{ steps.dev_tag.outputs.tag_name }}"
          APK_FILE="dev-artifacts/receipts-${TAG}.apk"
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "fdroid-repo/archive/top.tau2c.receipts.app_${TAG}.apk"
            cd fdroid-repo
            git add archive/
            git commit -m "feat(receipts): add nightly dev build ${TAG} to archive" || exit 0
            git push origin master
          fi
