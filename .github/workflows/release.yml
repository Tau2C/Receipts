name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine Release Channel
        id: channel
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-dev"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "fdroid_target_dir=archive" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "fdroid_target_dir=repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Setup Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build Receipts Release APK
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Collect Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/receipts-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: ${{ steps.channel.outputs.is_prerelease == 'true' }}
          generate_release_notes: true

      - name: Publish APK to F-Droid Repository
        if: ${{ env.FDROID_REPO_TOKEN != '' && !contains(github.ref_name, '-dev') && !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}
        env:
          FDROID_REPO_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${FDROID_REPO_TOKEN}@github.com/Tau2C/fdroid-repo.git" fdroid-repo
          TARGET_DIR="fdroid-repo/${{ steps.channel.outputs.fdroid_target_dir }}"
          mkdir -p "$TARGET_DIR"

          TAG_NAME="${GITHUB_REF_NAME}"
          APK_FILE="release-artifacts/receipts-${TAG_NAME}.apk"
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "${TARGET_DIR}/top.tau2c.receipts.app_${TAG_NAME}.apk"
            cd fdroid-repo
            git add -A "${{ steps.channel.outputs.fdroid_target_dir }}"
            git commit -m "feat(receipts): add Receipts ${TAG_NAME} to ${{ steps.channel.outputs.fdroid_target_dir }}" || exit 0
            git push origin master
          fi
