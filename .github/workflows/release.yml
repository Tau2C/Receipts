name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build Receipts Release APK
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd app
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Collect Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/receipts-${TAG_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish APK to F-Droid Repository
        if: ${{ env.FDROID_REPO_TOKEN != '' }}
        env:
          FDROID_REPO_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${FDROID_REPO_TOKEN}@github.com/Tau2C/fdroid-repo.git" fdroid-repo
          mkdir -p fdroid-repo/repo

          TAG_NAME="${GITHUB_REF_NAME}"
          APK_FILE="release-artifacts/receipts-${TAG_NAME}.apk"
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "fdroid-repo/repo/top.tau2c.receipts.app_${TAG_NAME}.apk"
            cd fdroid-repo
            git add repo/
            git commit -m "feat(receipts): add Receipts release ${TAG_NAME}" || exit 0
            git push origin master
          fi
